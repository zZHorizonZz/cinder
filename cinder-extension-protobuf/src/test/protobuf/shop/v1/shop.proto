syntax = "proto3";

package shop.v1;

import "google/protobuf/descriptor.proto";
import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "leadseal/v1/options.proto";

option java_multiple_files = true;
option java_package = "dev.horizon.cinder.protobuf.shop";

extend google.protobuf.FieldOptions {
  bool secret = 58100;
}

enum State {
  STATE_UNSPECIFIED = 0;
  OPEN = 1;
  PAID = 2;
}

message Address {
  string city = 1;
  string street = 2;
}

message Customer {
  option (leadseal.v1.table) = {name: "customers"};

  string id = 1 [(leadseal.v1.column).primary_key = true];
  string email = 2;
  int64 order_count = 3 [(leadseal.v1.column).ignore = true];
  repeated Tag tags = 4 [(leadseal.v1.column).ignore = true];
}

message Order {
  option (leadseal.v1.table) = {name: "orders"};

  int64 id = 1 [(leadseal.v1.column) = {primary_key: true, integer: {identity: true}}];
  string customer_id = 2 [(leadseal.v1.column).foreign_key = {message: "shop.v1.Customer"}];
  State state = 3;
  google.protobuf.Timestamp create_time = 4 [(leadseal.v1.column) = {name: "created_at", timestamp: {default_now: true}}];
  google.protobuf.Int64Value discount = 5;
  repeated string tags = 6;
  Address address = 7;
  map<string, int32> counts = 8;
  bytes token = 9;

  Customer customer = 10 [(leadseal.v1.column).ignore = true];
  repeated OrderLine lines = 11 [(leadseal.v1.column).ignore = true];
  string label = 12 [(leadseal.v1.column).generated = "upper(customer_id)"];
}

message OrderLine {
  option (leadseal.v1.table) = {};

  int64 id = 1 [(leadseal.v1.column).primary_key = true];
  int64 order_id = 2 [(leadseal.v1.column).foreign_key = {message: "shop.v1.Order"}];
  string product = 3;
  string note = 4 [(secret) = true];
}

message Ledger {
  option (leadseal.v1.table) = {name: "ledger", schema: "audit"};

  int64 id = 1 [(leadseal.v1.column).primary_key = true];
}

message Token {
  option (leadseal.v1.table) = {name: "tokens"};

  bytes id = 1 [(leadseal.v1.column).primary_key = true];
  string label = 2;
}

message Category {
  option (leadseal.v1.table) = {name: "categories"};

  int64 id = 1 [(leadseal.v1.column).primary_key = true];
  optional int64 parent_id = 2 [(leadseal.v1.column).foreign_key = {message: "shop.v1.Category"}];
  string name = 3;
  Category parent = 4 [(leadseal.v1.column).ignore = true];
  repeated Category children = 5 [(leadseal.v1.column).ignore = true];
}

message Shipment {
  option (leadseal.v1.table) = {name: "shipments"};

  int64 id = 1 [(leadseal.v1.column).primary_key = true];
  string billing_customer_id = 2 [(leadseal.v1.column).foreign_key = {message: "shop.v1.Customer"}];
  string shipping_customer_id = 3 [(leadseal.v1.column).foreign_key = {message: "shop.v1.Customer"}];
  Customer billing = 4 [(leadseal.v1.column).ignore = true];
  Customer shipping = 5 [(leadseal.v1.column).ignore = true];
}

message Tag {
  option (leadseal.v1.table) = {name: "tags"};

  int64 id = 1 [(leadseal.v1.column).primary_key = true];
  string label = 2;
}

message CustomerTag {
  option (leadseal.v1.table) = {name: "customer_tags"};

  string customer_id = 1 [(leadseal.v1.column) = {primary_key: true, foreign_key: {message: "shop.v1.Customer"}}];
  int64 tag_id = 2 [(leadseal.v1.column) = {primary_key: true, foreign_key: {message: "shop.v1.Tag"}}];
}
